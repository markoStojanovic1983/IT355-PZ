<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${pageTitle ?: 'Personal Finance Tracker'}">Personal Finance Tracker</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>

<!-- Head Fragment with all CSS -->
<th:block th:fragment="head-content">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</th:block>
<body>
    <!-- Navigation Fragment -->
    <header th:fragment="navigation">
        <nav class="navbar navbar-expand-lg navbar-dark custom-navbar">
            <div class="container">
                <a th:href="@{/}" class="navbar-brand fw-bold">
                    <i class="fa fa-chart-line"></i> Personal Finance Tracker
                </a>
                <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" 
                        aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
                    <span class="navbar-toggler-icon"></span>
                </button>
                <div class="collapse navbar-collapse" id="navbarNav">
                    <ul class="navbar-nav ms-auto">
                        <li class="nav-item">
                            <a th:href="@{/}" class="nav-link" th:classappend="${currentPage == 'dashboard'} ? 'active' : ''">Dashboard</a>
                        </li>
                        <li class="nav-item">
                            <a th:href="@{/expenses}" class="nav-link" th:classappend="${currentPage == 'expenses'} ? 'active' : ''">Expenses</a>
                        </li>
                        <li class="nav-item">
                            <a th:href="@{/incomes}" class="nav-link" th:classappend="${currentPage == 'incomes'} ? 'active' : ''">Incomes</a>
                        </li>
                        <li class="nav-item">
                            <a th:href="@{/transactions}" class="nav-link" th:classappend="${currentPage == 'transactions'} ? 'active' : ''">All Transactions</a>
                        </li>
                        <li class="nav-item">
                            <a th:href="@{/categories}" class="nav-link" th:classappend="${currentPage == 'categories'} ? 'active' : ''">Categories</a>
                        </li>
                    </ul>
                </div>
            </div>
        </nav>
    </header>
    
    <!-- Footer Fragment -->
    <footer th:fragment="footer" class="footer bg-dark text-white text-center py-4 mt-auto">
        <div class="container">
            <p class="mb-0">IT355 PZ - Marko Stojanovic 1983</p>
        </div>
    </footer>
    
    <!-- Scripts Fragment -->
    <div th:fragment="scripts">
        <!-- Bootstrap JS -->
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    </div>
    
    <!-- Form Validation Script Fragment -->
    <div th:fragment="form-validation-script">
        <script>
            // Bootstrap form validation
            (function() {
                'use strict';
                window.addEventListener('load', function() {
                    var forms = document.getElementsByClassName('needs-validation');
                    var validation = Array.prototype.filter.call(forms, function(form) {
                        form.addEventListener('submit', function(event) {
                            if (form.checkValidity() === false) {
                                event.preventDefault();
                                event.stopPropagation();
                            }
                            form.classList.add('was-validated');
                        }, false);
                    });
                }, false);
            })();
        </script>
    </div>
</body>
</html>
