<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <th:block th:insert="~{layout :: head-content}"></th:block>
    <title>Categories - Personal Finance Tracker</title>
</head>
<body>
    <!-- Navigation -->
    <th:block th:insert="~{layout :: navigation}"></th:block>
    
    <!-- Main Content -->
    <main class="main-content">
        <div class="container py-4">
            <div class="d-flex justify-content-between align-items-center mb-4 pb-3 border-bottom border-3 border-primary">
                <h1 class="text-dark">Expense Categories</h1>
                <a th:href="@{/categories/new}" class="btn btn-warning">
                    <i class="fa fa-plus"></i> Add New Category
                </a>
            </div>
            
            <div class="card shadow-sm">
                <div class="table-responsive">
                    <table class="table table-hover mb-0">
                        <thead class="table-dark">
                            <tr>
                                <th>ID</th>
                                <th>Category Name</th>
                                <th>Actions</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr th:if="${#lists.isEmpty(categories)}">
                                <td colspan="3" class="text-center text-muted py-5">
                                    <i class="fa fa-tags fa-3x mb-3 d-block"></i>
                                    No categories found. <a th:href="@{/categories/new}" class="text-decoration-none">Add the first one!</a>
                                </td>
                            </tr>
                            <tr th:each="category : ${categories}">
                                <td th:text="${category.id}" class="fw-medium">1</td>
                                <td>
                                    <span class="badge bg-warning text-dark fs-6" th:text="${category.name}">Food</span>
                                </td>
                                <td>
                                    <div class="btn-group btn-group-sm" role="group">
                                        <a th:href="@{/categories/edit/{id}(id=${category.id})}" class="btn btn-outline-secondary">
                                            <i class="fa fa-edit"></i> Edit
                                        </a>
                                        <a th:href="@{/categories/delete/{id}(id=${category.id})}" 
                                           class="btn btn-outline-danger"
                                           onclick="return confirm('Are you sure you want to delete this category? All associated expenses will also be deleted.')">
                                            <i class="fa fa-trash"></i> Delete
                                        </a>
                                    </div>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </main>
    
    <!-- Footer -->
    <th:block th:insert="~{layout :: footer}"></th:block>
    
    <!-- Scripts -->
    <th:block th:insert="~{layout :: scripts}"></th:block>
</body>
</html>
