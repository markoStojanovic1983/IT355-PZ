<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <th:block th:insert="~{layout :: head-content}"></th:block>
    <title>Expenses - Personal Finance Tracker</title>
</head>
<body>
    <!-- Navigation -->
    <th:block th:insert="~{layout :: navigation}"></th:block>
    
    <!-- Main Content -->
    <main class="main-content">
        <div class="container py-4">
            <div class="d-flex justify-content-between align-items-center mb-4 pb-3 border-bottom border-3 border-primary">
                <h1 class="text-dark">Expenses</h1>
                <a th:href="@{/expenses/new}" class="btn btn-primary">
                    <i class="fa fa-plus"></i> Add New Expense
                </a>
            </div>
            
            <div class="card shadow-sm">
                <div class="table-responsive">
                    <table class="table table-hover mb-0">
                        <thead class="table-dark">
                            <tr>
                                <th>ID</th>
                                <th>Description</th>
                                <th>Amount</th>
                                <th>Date</th>
                                <th>Category</th>
                                <th>Actions</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr th:if="${#lists.isEmpty(expenses)}">
                                <td colspan="6" class="text-center text-muted py-5">
                                    <i class="fa fa-receipt fa-3x mb-3 d-block"></i>
                                    No expenses found. <a th:href="@{/expenses/new}" class="text-decoration-none">Add the first one!</a>
                                </td>
                            </tr>
                            <tr th:each="expense : ${expenses}">
                                <td th:text="${expense.id}" class="fw-medium">1</td>
                                <td th:text="${expense.description}">Groceries</td>
                                <td class="fw-bold text-danger">$<span th:text="${#numbers.formatDecimal(expense.amount, 1, 2)}">0.00</span></td>
                                <td th:text="${#temporals.format(expense.date, 'yyyy-MM-dd')}">2024-01-01</td>
                                <td>
                                    <span th:if="${expense.category != null}" 
                                          class="badge bg-secondary" 
                                          th:text="${expense.category.name}">Food</span>
                                    <span th:if="${expense.category == null}" 
                                          class="text-muted fst-italic">No Category</span>
                                </td>
                                <td>
                                    <div class="btn-group btn-group-sm" role="group">
                                        <a th:href="@{/expenses/edit/{id}(id=${expense.id})}" class="btn btn-outline-secondary">
                                            <i class="fa fa-edit"></i> Edit
                                        </a>
                                        <a th:href="@{/expenses/delete/{id}(id=${expense.id})}" 
                                           class="btn btn-outline-danger"
                                           onclick="return confirm('Are you sure you want to delete this expense?')">
                                            <i class="fa fa-trash"></i> Delete
                                        </a>
                                    </div>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </main>
    
    <!-- Footer -->
    <th:block th:insert="~{layout :: footer}"></th:block>
    
    <!-- Scripts -->
    <th:block th:insert="~{layout :: scripts}"></th:block>
</body>
</html>
