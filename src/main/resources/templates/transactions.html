<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <th:block th:insert="~{layout :: head-content}"></th:block>
    <title>All Transactions - Personal Finance Tracker</title>
</head>
<body>
    <!-- Navigation -->
    <th:block th:insert="~{layout :: navigation}"></th:block>
    
    <!-- Main Content -->
    <main class="main-content">
        <div class="container py-4">
            <div class="d-flex justify-content-between align-items-center mb-4 pb-3 border-bottom border-3 border-primary">
                <h1 class="text-dark">All Transactions</h1>
                <div class="d-flex gap-2">
                    <a th:href="@{/expenses/new}" class="btn btn-danger">
                        <i class="fa fa-plus"></i> Add Expense
                    </a>
                    <a th:href="@{/incomes/new}" class="btn btn-success">
                        <i class="fa fa-plus"></i> Add Income
                    </a>
                </div>
            </div>
            
            <div class="card shadow-sm">
                <div class="table-responsive">
                    <table class="table table-hover mb-0">
                        <thead class="table-dark">
                            <tr>
                                <th>Date</th>
                                <th>Type</th>
                                <th>Description</th>
                                <th>Category</th>
                                <th>Amount</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr th:if="${#lists.isEmpty(transactions)}">
                                <td colspan="5" class="text-center text-muted py-5">
                                    <i class="fa fa-exchange-alt fa-3x mb-3 d-block"></i>
                                    No transactions found. <a th:href="@{/expenses/new}" class="text-decoration-none">Add your first transaction!</a>
                                </td>
                            </tr>
                            <tr th:each="transaction : ${transactions}">
                                <td th:text="${#temporals.format(transaction.date, 'yyyy-MM-dd')}" class="fw-medium">2024-01-01</td>
                                <td>
                                    <span th:if="${transaction.type == 'INCOME'}" class="badge bg-success">
                                        <i class="fa fa-arrow-up"></i> Income
                                    </span>
                                    <span th:if="${transaction.type == 'EXPENSE'}" class="badge bg-danger">
                                        <i class="fa fa-arrow-down"></i> Expense
                                    </span>
                                </td>
                                <td th:text="${transaction.description}">Transaction description</td>
                                <td>
                                    <span th:if="${transaction.category != null}" 
                                          class="badge bg-secondary" 
                                          th:text="${transaction.category.name}">Category</span>
                                    <span th:if="${transaction.category == null}" 
                                          class="text-muted fst-italic">-</span>
                                </td>
                                <td class="fw-bold" th:classappend="${transaction.type == 'INCOME'} ? 'text-success' : 'text-danger'">
                                    <span th:if="${transaction.type == 'INCOME'}">+</span>
                                    <span th:if="${transaction.type == 'EXPENSE'}">-</span>
                                    $<span th:text="${#numbers.formatDecimal(transaction.amount, 1, 2)}">0.00</span>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </main>
    
    <!-- Footer -->
    <th:block th:insert="~{layout :: footer}"></th:block>
    
    <!-- Scripts -->
    <th:block th:insert="~{layout :: scripts}"></th:block>
</body>
</html>
